name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # macOS Apple Silicon (ARM64 M-series)
          - os: macos-latest
            target: aarch64-apple-darwin
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@7b764047a2503a749594f885e507b9efb783abf3 # master
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be954172b49e29bedfda82b6 # v2.7.7

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Cargo Check
        run: cargo check --workspace --all-targets

      - name: Cargo Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Test Suite
        run: cargo test --workspace --all-targets

  security-audit:
    name: Supply Chain Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@7b764047a2503a749594f885e507b9efb783abf3 # master

      - name: Cargo Deny Check
        uses: EmbarkStudios/cargo-deny-action@3f4a782664881cfac704d5fad03c418641beffd8 # v2.0.9
        with:
          command: check
