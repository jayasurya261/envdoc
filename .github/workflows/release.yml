name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.2)'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish-platforms:
    name: Build & Publish (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            bin_name: envdoctor
            bin_ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64
            bin_name: envdoctor.exe
            bin_ext: '.exe'
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-arm64
            bin_name: envdoctor
            bin_ext: ''
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin-x64
            bin_name: envdoctor
            bin_ext: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p envdoc --target ${{ matrix.target }}

      - name: Prepare platform npm package
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          
          PLATFORM_DIR="packages/npm/platforms/${{ matrix.platform }}"
          mkdir -p "$PLATFORM_DIR/bin"
          
          # Copy compiled binary
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$PLATFORM_DIR/bin/${{ matrix.bin_name }}"
          chmod +x "$PLATFORM_DIR/bin/${{ matrix.bin_name }}" || true
          
          # Update version in platform package.json
          node -e "
            const fs = require('fs');
            const pkgPath = '$PLATFORM_DIR/package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          "
          
          # Stage artifact for GitHub Releases
          mkdir -p release-binaries
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "release-binaries/envdoctor-${{ matrix.target }}${{ matrix.bin_ext }}"
          
          # Copy README and License into platform directory
          cp README.md "$PLATFORM_DIR/README.md"
          cp LICENSE-MIT "$PLATFORM_DIR/LICENSE-MIT" 2>/dev/null || cp LICENSE "$PLATFORM_DIR/LICENSE" 2>/dev/null || true

      - name: Upload release binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: envdoctor-${{ matrix.platform }}
          path: release-binaries/*

      - name: Setup Node.js for npm publishing
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish platform package to npm
        shell: bash
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish "packages/npm/platforms/${{ matrix.platform }}" --access public --provenance false || true
          else
            echo "NPM_TOKEN secret not configured; skipping npm publish."
          fi

  publish-main-and-github-release:
    name: Publish Main Package & GitHub Release
    needs: build-and-publish-platforms
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release binaries
        uses: actions/download-artifact@v4
        with:
          path: all-binaries
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Update version and dependencies in main npm package
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          
          node -e "
            const fs = require('fs');
            const pkgPath = 'packages/npm/package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = '$VERSION';
            if (pkg.optionalDependencies) {
              for (const k of Object.keys(pkg.optionalDependencies)) {
                pkg.optionalDependencies[k] = '$VERSION';
              }
            }
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish envdoc-cli to npm
        shell: bash
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish packages/npm --access public --provenance false || true
          else
            echo "NPM_TOKEN secret not configured; skipping npm publish."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: all-binaries/*
          generate_release_notes: true
