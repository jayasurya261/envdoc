[package]
name = "envdoctor-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
envdoctor = { package = "envdoc", path = "../crates/envdoctor", features = ["lang-python", "lang-go", "lang-infra"] }

[[bin]]
name = "fuzz_dialect"
path = "fuzz_targets/fuzz_dialect.rs"
test = false
doc = false

[[bin]]
name = "fuzz_js"
path = "fuzz_targets/fuzz_js.rs"
test = false
doc = false

[[bin]]
name = "fuzz_python"
path = "fuzz_targets/fuzz_python.rs"
test = false
doc = false

[[bin]]
name = "fuzz_go"
path = "fuzz_targets/fuzz_go.rs"
test = false
doc = false

[[bin]]
name = "fuzz_infra"
path = "fuzz_targets/fuzz_infra.rs"
test = false
doc = false
