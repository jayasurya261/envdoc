[package]
name = "envdoc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[lib]
name = "envdoctor"
path = "src/lib.rs"

[[bin]]
name = "envdoctor"
path = "src/main.rs"

[features]
default = ["lang-python", "lang-go", "lang-infra"]
lang-python = ["dep:ruff_python_parser", "dep:ruff_python_ast", "dep:ruff_text_size"]
lang-go = []
lang-infra = []

[dependencies]
clap = { workspace = true }
ignore = { workspace = true }
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_parser = { workspace = true }
oxc_span = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
syn = { workspace = true }
proc-macro2 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
toml = "0.8"
ruff_python_parser = { version = "0.0.20", optional = true }
ruff_python_ast = { version = "0.0.20", optional = true }
ruff_text_size = { version = "0.0.20", optional = true }

[target.'cfg(unix)'.dependencies]
rlimit = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
proptest = { workspace = true }
tempfile = "3.27.0"
trybuild = { workspace = true }

[[bench]]
name = "scan_bench"
harness = false

