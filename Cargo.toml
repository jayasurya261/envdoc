[workspace]
resolver = "2"
members = [
    "crates/envdoctor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"
authors = ["EnvDoctor Contributors"]
repository = "https://github.com/envdoctor/envdoctor"

[workspace.dependencies]
proptest = "1.6"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
trybuild = "1.0.122"

