[workspace]
resolver = "2"
members = [
    "crates/envdoctor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"
authors = ["EnvDoctor Contributors"]
repository = "https://github.com/envdoctor/envdoctor"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4.23"
oxc_allocator = "0.155.0"
oxc_ast = "0.155.0"
oxc_parser = "0.155.0"
oxc_span = "0.155.0"
proptest = "1.6"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
syn = { version = "2.0", features = ["full", "visit"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
thiserror = "2.0.12"
trybuild = "1.0.122"

